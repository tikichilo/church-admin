<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Makeni Central SDA Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary:   #041534;
    --gold:      #755b00;
    --gold-lt:   #fed977;
    --gold-dim:  #e6c364;
    --surface:   #f9f9f9;
    --border:    #e2e2e2;
    --text:      #1a1c1c;
    --muted:     #45464e;
    --danger:    #ba1a1a;
    --success:   #2e7d32;
    --radius:    12px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--primary);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* Background decorative elements */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,195,100,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,195,100,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Grid overlay */
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(230,195,100,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230,195,100,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .auth-card {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    padding: 48px 40px;
    position: relative;
    z-index: 1;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    animation: slideUp 0.5s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo-ring {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--gold-dim);
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--gold-dim);
    font-weight: 700;
    box-shadow: 0 0 0 6px rgba(4,21,52,0.08);
  }
  .brand h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.2;
  }
  .brand p {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 0 28px;
    position: relative;
  }
  .divider span {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: #fff;
    padding: 0 12px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap input {
    width: 100%;
    padding: 11px 14px 11px 42px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap input:focus {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px rgba(230,195,100,0.15);
    background: #fff;
  }
  .input-icon {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    opacity: 0.6;
    pointer-events: none;
  }
  .password-toggle {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    cursor: pointer; color: var(--muted);
    opacity: 0.6; padding: 2px;
    display: flex; align-items: center;
    transition: opacity 0.2s;
  }
  .password-toggle:hover { opacity: 1; }

  .error-msg {
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    display: none;
    padding: 8px 12px;
    background: #fff5f5;
    border-radius: 7px;
    border-left: 3px solid var(--danger);
  }
  .error-msg.show { display: block; }

  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .btn-submit:hover { background: #0a2248; }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-submit.loading::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .btn-submit.loading span { opacity: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .switch-link {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  .switch-link a {
    color: var(--gold);
    font-weight: 600;
    text-decoration: none;
  }
  .switch-link a:hover { text-decoration: underline; }

  /* toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--primary);
    color: #fff;
    padding: 12px 22px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.35s ease;
    white-space: nowrap;
    z-index: 999;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.danger { background: var(--danger); }
  #toast.success { background: var(--success); }

  /* ═══════════════════════════════════════════
     MOBILE FIX
     - Inputs at 14px trigger iOS Safari's auto-zoom
       on focus — bumping to 16px on mobile stops the
       page jumping/zooming when the keyboard opens.
     - Toast used white-space: nowrap, which can run
       off-screen on narrow phones for longer messages.
     - Card padding trimmed for very narrow screens.
  ═══════════════════════════════════════════ */
  @media (max-width: 480px) {
    .input-wrap input {
      font-size: 16px;
    }
    .auth-card {
      padding: 32px 24px;
    }
    #toast {
      white-space: normal;
      max-width: calc(100vw - 48px);
      text-align: center;
    }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="auth-card">
  <div class="brand">
    <div class="logo-ring">M</div>
    <h1>Makeni Central SDA</h1>
    <p>Admin Portal</p>
  </div>

  <div class="divider"><span>Sign In</span></div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <input type="email" id="email" placeholder="admin@makenicentral.org" autocomplete="email"/>
    </div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap">
      <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" id="password"/>
      <button class="password-toggle" type="button" onclick="togglePw('password', this)" title="Show/hide password">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="error-msg" id="error-msg">Invalid email or password. Please try again.</div>
  </div>

  <div class="switch-link" style="margin-top:12px;margin-bottom:0">
  <a href="forgot-password.html">Forgot your password?</a>
  </div>

  <button class="btn-submit" id="submit-btn" onclick="handleLogin()">
    <span>Sign In to Dashboard</span>
  </button>

  <div class="switch-link">
    Don't have an account? <a href="signup.html">Request access</a>
  </div>
</div>

<div id="toast"></div>

<script>
  // If already logged in, go straight to admin
  if (localStorage.getItem('sda_admin_token')) {
    window.location.href = 'admin.html';
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.innerHTML = isHidden
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = type ? 'show ' + type : 'show';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = '', 3000);
  }

  async function handleLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('error-msg');
    const btn      = document.getElementById('submit-btn');

    errEl.classList.remove('show');

    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.classList.add('show');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const API_URL = (localStorage.getItem('sda_admin_api') || '').replace(/\/+$/, '');
      const res = await fetch(API_URL + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('sda_admin_token', data.token);
        localStorage.setItem('sda_admin_user', JSON.stringify({ name: data.name, email: data.email, role: data.role }));
        showToast('Welcome back, ' + data.name + '!', 'success');
        setTimeout(() => window.location.href = 'admin.html', 600);
      } else {
        errEl.textContent = data.error || 'Invalid email or password.';
        errEl.classList.add('show');
        document.getElementById('password').value = '';
      }
    } catch (e) {
      errEl.textContent = 'Could not reach the server. Check your connection.';
      errEl.classList.add('show');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
